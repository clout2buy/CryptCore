[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "crypt-agent"
version = "0.3.0"
description = "Protected runtime and terminal coding harness for Crypt."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Crypt contributors" }]
dependencies = [
    "anthropic>=0.72,<1",
    "google-auth>=2.40,<3",
    "google-auth-oauthlib>=1.2,<2",
    "pypdf>=5.9,<7",
    "python-dotenv>=1.1,<2",
    "rich>=14,<15",
]

[project.optional-dependencies]
dev = [
    "build>=1.3,<2",
    "pip-audit>=2.9,<3",
    "pytest>=8.4,<9",
    "pytest-cov>=7,<8",
    "ruff>=0.14,<1",
]

[project.scripts]
crypt = "main:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["benchmarks*", "core*", "tools*", "crypt*"]

[tool.setuptools.package-data]
benchmarks = ["*.json"]
"core.webui_static" = ["*.html", "*.css", "*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.coverage.run]
branch = true
source = ["core", "tools"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 60
