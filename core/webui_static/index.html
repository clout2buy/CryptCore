<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crypt</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div class="app-shell">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">C</span>
          <div>
            <h1>Crypt</h1>
            <p id="statusLine">Ready</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="newChatButton" class="quiet-button" type="button">New</button>
          <button id="activityButton" class="quiet-button" type="button" aria-expanded="false">Activity</button>
        </div>
      </header>

      <main class="chat-stage" aria-label="Crypt chat">
        <section class="conversation">
          <div id="welcome" class="welcome">
            <p>Crypt</p>
            <h2>Say anything.</h2>
          </div>
          <div id="feed" class="feed" aria-live="polite"></div>
        </section>

        <section id="approvalTray" class="approval-tray" hidden>
          <div>
            <strong>Permission needed</strong>
            <p id="approvalText"></p>
          </div>
          <div class="approval-actions">
            <button id="denyButton" class="quiet-button" type="button">Deny</button>
            <button id="approveButton" type="button">Approve</button>
          </div>
        </section>

        <form id="promptForm" class="composer">
          <textarea id="prompt" rows="1" placeholder="Message Crypt"></textarea>
          <button id="sendButton" type="submit">Send</button>
        </form>
      </main>

      <aside id="activityPanel" class="activity-panel" aria-label="Crypt activity" aria-hidden="true">
        <header>
          <div>
            <p>Behind the scenes</p>
            <h2>Activity</h2>
          </div>
          <button id="closeActivityButton" class="quiet-button" type="button">Hide</button>
        </header>
        <div id="quietStats" class="quiet-stats"></div>
        <div id="activityFeed" class="activity-feed"></div>
      </aside>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
