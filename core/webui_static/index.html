<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crypt</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div class="app-shell">
      <nav class="surface-dock" aria-label="Crypt surfaces">
        <button class="surface-button active" type="button" data-surface="chat" title="Chat">Chat</button>
        <button class="surface-button" type="button" data-surface="studio" title="Studio">Studio</button>
        <button class="surface-button" type="button" data-surface="preview" title="Preview">Preview</button>
        <button class="surface-button" type="button" data-surface="plan" title="Plan">Plan</button>
        <button class="surface-button" type="button" data-surface="tools" title="Tools">Tools</button>
        <button class="surface-button" type="button" data-surface="github" title="GitHub">GitHub</button>
      </nav>

      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">C</span>
          <div>
            <h1>Crypt</h1>
            <p id="statusLine">Ready</p>
          </div>
        </div>
        <div class="top-actions">
          <button id="newChatButton" class="quiet-button" type="button">New</button>
          <button id="activityButton" class="quiet-button" type="button" aria-expanded="false">Core</button>
        </div>
      </header>

      <main class="chat-stage" aria-label="Crypt chat">
        <section class="conversation">
          <div id="welcome" class="welcome">
            <p>Crypt</p>
            <h2>What are we building?</h2>
            <div class="capability-grid" aria-label="Crypt capabilities">
              <article>
                <span>01</span>
                <b>Build</b>
                <em>apps, scripts, agents</em>
              </article>
              <article>
                <span>02</span>
                <b>Research</b>
                <em>web, repos, markets</em>
              </article>
              <article>
                <span>03</span>
                <b>Operate</b>
                <em>tasks, docs, business</em>
              </article>
              <article>
                <span>04</span>
                <b>Learn</b>
                <em>skills, memory, soul</em>
              </article>
            </div>
          </div>
          <div id="feed" class="feed" aria-live="polite"></div>
        </section>

        <section id="approvalTray" class="approval-tray" hidden>
          <div>
            <strong>Permission needed</strong>
            <p id="approvalText"></p>
          </div>
          <div class="approval-actions">
            <button id="denyButton" class="quiet-button" type="button">Deny</button>
            <button id="approveButton" type="button">Approve</button>
          </div>
        </section>

        <form id="promptForm" class="composer">
          <div class="composer-shell">
            <div class="composer-tools" aria-label="Optional intent hints">
              <button class="intent-toggle" type="button" data-intent="web">Web</button>
              <button class="intent-toggle" type="button" data-intent="files">Files</button>
              <button class="intent-toggle" type="button" data-intent="build">Build</button>
              <button class="intent-toggle" type="button" data-intent="auto">Auto</button>
            </div>
            <div class="composer-main">
              <span class="prompt-mark" aria-hidden="true">&gt;</span>
              <textarea id="prompt" rows="1" placeholder="Message Crypt"></textarea>
              <button id="sendButton" type="submit" aria-label="Send message">Send</button>
            </div>
            <div class="composer-meta">
              <span id="enginePill">crypt</span>
              <span id="intentPill">autopilot</span>
            </div>
          </div>
        </form>
      </main>

      <aside id="activityPanel" class="activity-panel" aria-label="Crypt core" aria-hidden="true">
        <header>
          <div>
            <p>Quiet systems</p>
            <h2>Core</h2>
          </div>
          <button id="closeActivityButton" class="quiet-button" type="button">Hide</button>
        </header>
        <div id="quietStats" class="quiet-stats"></div>
        <div id="activityFeed" class="activity-feed"></div>
      </aside>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
