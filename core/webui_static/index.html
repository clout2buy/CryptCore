<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Crypt</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <video
      class="ambient-video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260418_080021_d598092b-c4c2-4e53-8e46-94cf9064cd50.mp4"
      autoplay
      muted
      playsinline
      loop
      preload="metadata"
      aria-hidden="true"
    ></video>
    <div class="video-shade" aria-hidden="true"></div>
    <canvas id="ambient" aria-hidden="true"></canvas>
    <div class="workspace-shell">
      <aside class="sidebar" aria-label="Crypt workspace navigation">
        <header class="side-brand">
          <span class="brand-mark">C</span>
          <div>
            <h1>Crypt Workspace</h1>
            <p id="sideStatus">Ready</p>
          </div>
        </header>

        <div class="side-actions">
          <button id="searchButton" class="side-action" type="button">Search</button>
          <button id="newChatButton" class="side-action" type="button">New Session</button>
        </div>

        <nav class="nav-groups">
          <section>
            <h2>Main</h2>
            <button class="nav-item active" type="button" data-view="panel">Panel</button>
            <button class="nav-item" type="button" data-view="chat">Chat</button>
            <button class="nav-item" type="button" data-view="files">Files</button>
            <button class="nav-item" type="button" data-view="terminal">Terminal</button>
            <button class="nav-item" type="button" data-view="jobs">Jobs</button>
            <button class="nav-item" type="button" data-view="missions">Missions</button>
          </section>
          <section>
            <h2>Knowledge</h2>
            <button class="nav-item" type="button" data-view="memory">Memory</button>
            <button class="nav-item" type="button" data-view="skills">Skills</button>
            <button class="nav-item" type="button" data-view="persona">Persona</button>
          </section>
          <section>
            <h2>System</h2>
            <button class="nav-item" type="button" data-view="models">Models</button>
            <button class="nav-item" type="button" data-view="providers">Providers</button>
            <button class="nav-item" type="button" data-view="tools">Tools</button>
            <button class="nav-item" type="button" data-view="gateway">Gateway</button>
            <button class="nav-item" type="button" data-view="settings">Settings</button>
          </section>
        </nav>

        <section class="session-strip">
          <div class="section-head">
            <h2>Sessions</h2>
            <span id="sessionCount">0</span>
          </div>
          <div id="sessionList" class="mini-list"></div>
        </section>

        <footer class="side-footer">
          <span>User</span>
          <button id="coreButton" class="icon-button" type="button">Core</button>
        </footer>
      </aside>

      <main class="main-stage">
        <header class="topbar">
          <div>
            <p id="viewEyebrow">Home</p>
            <h2 id="viewTitle">Crypt Console</h2>
          </div>
          <div class="top-actions">
            <button class="quiet-button" type="button" data-view="chat">Chat</button>
            <button class="quiet-button" type="button" data-view="missions">Missions</button>
            <button id="activityButton" class="quiet-button" type="button" aria-expanded="false">Core</button>
          </div>
        </header>

        <section id="viewHost" class="view-host" aria-live="polite"></section>

        <section id="approvalTray" class="approval-tray" hidden>
          <div>
            <strong>Permission needed</strong>
            <p id="approvalText"></p>
          </div>
          <div class="approval-actions">
            <button id="denyButton" class="quiet-button" type="button">Deny</button>
            <button id="approveButton" type="button">Approve</button>
          </div>
        </section>

        <form id="promptForm" class="composer">
          <div class="composer-shell">
            <div class="composer-tools" aria-label="Optional intent hints">
              <button class="intent-toggle" type="button" data-intent="web">Web</button>
              <button class="intent-toggle" type="button" data-intent="files">Files</button>
              <button class="intent-toggle" type="button" data-intent="build">Build</button>
              <button class="intent-toggle" type="button" data-intent="auto">Auto</button>
            </div>
            <div class="composer-main">
              <span class="prompt-mark" aria-hidden="true">&gt;</span>
              <textarea id="prompt" rows="1" placeholder="Ask Crypt to do anything"></textarea>
              <button id="sendButton" type="submit" aria-label="Send message">Send</button>
            </div>
            <div class="composer-meta">
              <span id="enginePill">crypt</span>
              <span id="intentPill">autopilot</span>
            </div>
          </div>
        </form>
      </main>

      <aside id="activityPanel" class="activity-panel" aria-label="Crypt core" aria-hidden="true">
        <header>
          <div>
            <p>Quiet systems</p>
            <h2>Core</h2>
          </div>
          <button id="closeActivityButton" class="quiet-button" type="button">Hide</button>
        </header>
        <div id="quietStats" class="quiet-stats"></div>
        <div id="activityFeed" class="activity-feed"></div>
      </aside>
    </div>

    <script src="/app.js"></script>
  </body>
</html>
